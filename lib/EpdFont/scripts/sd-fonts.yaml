# Core SD card font families published from dezzw/crossmux (see font-release-pins.yaml).
#
# NotoSansSC matches crossmux.com m1-b4 glyph coverage (see noto_m1_b4_hanzi_coverage.txt).
# Real Regular + Bold masters only (italic resolves to Regular on device).

scriptGroups:
  - {tag: latin, label: Latin}
  - {tag: cyrillic, label: Cyrillic}
  - {tag: greek, label: Greek}
  - {tag: cjk, label: CJK}

families:
  - name: Literata
    description: "Screen-optimized serif (Latin, Greek, Cyrillic)"
    scripts: [latin, cyrillic, greek]
    intervals: latin-ext,greek,cyrillic,ipa-chars
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {path: "scripts/pinned_sources/Literata-Regular.ttf"}
      bold:       {path: "scripts/pinned_sources/Literata-Bold.ttf"}
      italic:     {path: "scripts/pinned_sources/Literata-Italic.ttf"}
      bolditalic: {path: "scripts/pinned_sources/Literata-BoldItalic.ttf"}

  - name: Inter
    description: "Modern sans-serif (Latin, Greek, Cyrillic)"
    scripts: [latin, cyrillic, greek]
    intervals: latin-ext,greek,cyrillic,ipa-chars
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {path: "scripts/pinned_sources/regular_opsz14_wght400_1792208625.ttf"}
      bold:       {path: "scripts/pinned_sources/bold_opsz14_wght700_1792208625.ttf"}
      italic:     {path: "scripts/pinned_sources/italic_opsz14_wght400_1792208629.ttf"}
      bolditalic: {path: "scripts/pinned_sources/bolditalic_opsz14_wght700_1792208629.ttf"}

  - name: NotoSansSC
    description: "Simplified Chinese (Noto Sans SC, OFL)"
    scripts: [cjk]
    intervals: latin-ext,punctuation,cjk,greek,cyrillic,ipa-chars,combining,letterlike,enclosed-alphanumerics,ext-a,cjk-symbols,symbols
    codepoints_file: noto_m1_b4_hanzi_coverage.txt
    sizes: [8, 10, 12, 14, 16, 18]
    styles:
      regular:    {path: "scripts/pinned_sources/NotoSansSC-Regular.otf"}
      bold:       {path: "scripts/pinned_sources/NotoSansSC-Bold.otf"}
