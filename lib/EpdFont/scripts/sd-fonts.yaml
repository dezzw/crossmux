# Core SD card font families published from dezzw/crossmux (see font-release-pins.yaml).
#
# Fields match build-sd-fonts.py expectations. Upstream commits are pinned in URLs.

scriptGroups:
  - {tag: latin, label: Latin}
  - {tag: cyrillic, label: Cyrillic}
  - {tag: greek, label: Greek}
  - {tag: cjk, label: CJK}

families:
  - name: Literata
    description: "Screen-optimized serif (Latin, Greek, Cyrillic)"
    scripts: [latin, cyrillic, greek]
    intervals: latin-ext,greek,cyrillic,ipa-chars
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/googlefonts/literata/0c2761b727a1b3a7cffd313c37f0f5163dfc7a63/fonts/ttf/Literata-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/googlefonts/literata/0c2761b727a1b3a7cffd313c37f0f5163dfc7a63/fonts/ttf/Literata-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/googlefonts/literata/0c2761b727a1b3a7cffd313c37f0f5163dfc7a63/fonts/ttf/Literata-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/googlefonts/literata/0c2761b727a1b3a7cffd313c37f0f5163dfc7a63/fonts/ttf/Literata-BoldItalic.ttf"}

  - name: Inter
    description: "Modern sans-serif (Latin, Greek, Cyrillic)"
    scripts: [latin, cyrillic, greek]
    intervals: latin-ext,greek,cyrillic,ipa-chars
    sizes: [12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf", variable: {wght: 400, opsz: 14}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf", variable: {wght: 700, opsz: 14}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/inter/Inter-Italic%5Bopsz%2Cwght%5D.ttf", variable: {wght: 400, opsz: 14}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/inter/Inter-Italic%5Bopsz%2Cwght%5D.ttf", variable: {wght: 700, opsz: 14}}

  - name: NotoSansSC
    description: "Simplified Chinese (Noto Sans SC, OFL)"
    scripts: [cjk]
    intervals: cjk
    sizes: [8, 10, 12, 14, 16, 18]
    styles:
      regular:    {path: "builtinFonts/source/NotoSansSC/NotoSansSC-Regular.otf"}
      bold:       {path: "builtinFonts/source/NotoSansSC/NotoSansSC-Regular.otf"}
      italic:     {path: "builtinFonts/source/NotoSansSC/NotoSansSC-Regular.otf"}
      bolditalic: {path: "builtinFonts/source/NotoSansSC/NotoSansSC-Regular.otf"}
