name: CI (build)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: 10

jobs:
  select_runner:
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Verify SecureNet overlay
        run: python3 scripts/seed_securenet_overlay.py --check

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build-waveshare-397-nightly:
    name: Build Waveshare 3.97 nightly (ESP32-S3)
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - name: Use runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Cache PlatformIO packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Verify SecureNet overlay
        run: python3 scripts/seed_securenet_overlay.py --check

      - name: Build Waveshare 3.97 nightly firmware
        env:
          CROSSPOINT_RC_RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          pio run -e waveshare_epaper_397_nightly | tee pio-waveshare.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          extract_flash_used() {
            grep -E 'Flash:.*used' "$1" | tail -1 | sed -n 's/.*used \([0-9,]*\).*/\1/p' | tr -d ','
          }
          PR_FLASH="$(extract_flash_used pio-waveshare.log)"
          git fetch origin main
          git worktree add --detach ../crossmux-main-flash origin/main
          pushd ../crossmux-main-flash >/dev/null
          git submodule sync --recursive
          git submodule update --init --recursive
          if [[ -f scripts/seed_securenet_overlay.py ]]; then
            python3 scripts/seed_securenet_overlay.py --check
          fi
          pio run -e waveshare_epaper_397_nightly 2>&1 | tee ../crossmux-main-flash.log
          popd >/dev/null
          MAIN_FLASH="$(extract_flash_used ../crossmux-main-flash.log)"
          if [[ -z "$MAIN_FLASH" ]]; then
            echo "::warning::Could not extract main-branch flash size from ../crossmux-main-flash.log"
          fi
          DELTA=""
          if [[ -n "$PR_FLASH" && -n "$MAIN_FLASH" ]]; then
            DELTA=$((PR_FLASH - MAIN_FLASH))
          fi
          {
            echo "## Waveshare 3.97 nightly firmware build stats"
            echo '```text'
            grep -E '^Processing |RAM:\\s|Flash:\\s' pio-waveshare.log || true
            echo "Flash used (PR): ${PR_FLASH} bytes"
            echo "Flash used (origin/main): ${MAIN_FLASH:-unknown} bytes"
            if [[ -n "$DELTA" ]]; then
              echo "Flash used delta vs origin/main: ${DELTA} bytes"
            else
              echo "Flash used delta vs origin/main: unavailable (main=${MAIN_FLASH:-empty}, pr=${PR_FLASH})"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$DELTA" ]]; then
            echo "::warning::Flash delta vs origin/main unavailable (PR=${PR_FLASH}, main=${MAIN_FLASH:-empty})"
          else
            echo "Flash used delta vs origin/main: ${DELTA} bytes (PR ${PR_FLASH}, main ${MAIN_FLASH})"
          fi
          git worktree remove ../crossmux-main-flash --force

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev libmbedtls-dev

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Generate OTA signing known-answer fixture header
        run: |
          pip install 'cryptography==44.0.2'
          python3 scripts/generate_ota_signing_fixture.py

      - name: Generate host wolfSSL user settings
        run: |
          python3 scripts/tls/generate_host_user_settings.py
          git diff --exit-code scripts/tls/wolfssl_device_user_settings.h

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j -LE network

      - name: Verify TLS bundle against OTA/font hosts (wolfSSL)
        run: |
          set -euo pipefail
          if ! curl -fsSL --connect-timeout 5 --max-time 10 https://github.com >/dev/null; then
            echo "::warning::Skipping network TLS host checks (offline)"
            exit 0
          fi
          bash scripts/ci_verify_tls_hosts.sh build/test/tls_chain_verify/TlsHostVerify

      - name: Run network-tagged tests
        run: |
          set -euo pipefail
          if ! curl -fsSL --connect-timeout 5 --max-time 10 https://github.com >/dev/null; then
            echo "::warning::Skipping network-tagged ctests (offline)"
            exit 0
          fi
          ctest --test-dir build/test --output-on-failure -j -L network --repeat until-pass:2

      - name: Run FreeInk SDK host tests
        run: |
          bash freeink-sdk/libs/book/FreeInkBook/test/host/run.sh
          bash freeink-sdk/libs/ui/FreeInkUI/test/host/run.sh

      - name: Run hardware packaging tests
        run: python3 -m unittest discover -v -s scripts/tests

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build-waveshare-397-nightly
      - clang-format
      - cppcheck
      - select_runner
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
