name: Build & Publish SD Card Fonts

# Run manually when font sources or the conversion pipeline change.
# Publishes .cpfont files, fonts.json, and license assets to GitHub Releases on this repo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fonts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install font tools
        run: pip install freetype-py fonttools pyyaml

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev

      - name: Read version constants
        id: versions
        run: |
          cd lib/EpdFont/scripts
          echo "binary=$(python3 -c 'from cpfont_version import CPFONT_VERSION; print(CPFONT_VERSION)')" >> "$GITHUB_OUTPUT"
          echo "metadata=$(python3 -c 'from cpfont_version import FONTS_MANIFEST_VERSION; print(FONTS_MANIFEST_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned NotoSansSC source
        run: python3 scripts/fetch_notosans_sc_source.py

      - name: Build SD card fonts
        run: python3 lib/EpdFont/scripts/build-sd-fonts.py --clean --verbose -j 1

      - name: Flatten output for release assets
        run: |
          mkdir -p dist
          find lib/EpdFont/scripts/output -name '*.cpfont' -exec cp {} dist/ \;

      - name: Compute release tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="fonts-m${{ steps.versions.outputs.metadata }}-b${{ steps.versions.outputs.binary }}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          LAST=$(gh release list --repo "${{ github.repository }}" \
            --json tagName --jq \
            '[.[] | select(.tagName | startswith("'"${BASE}-r"'")) | .tagName | split("-r")[1] | tonumber] | max // 0')
          NEXT=$((LAST + 1))
          echo "revision=$NEXT" >> "$GITHUB_OUTPUT"
          echo "versioned=${BASE}-r${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Generate manifest
        run: |
          python3 scripts/generate-font-manifest.py \
            --input dist \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.tags.outputs.base }}/" \
            --output dist/fonts.json \
            --descriptions-from lib/EpdFont/scripts/sd-fonts.yaml

      - name: Prepare license assets
        run: python3 scripts/prepare_font_release_assets.py --output dist

      - name: Publish immutable font revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONED="${{ steps.tags.outputs.versioned }}"
          TITLE="SD Card Fonts (${VERSIONED#fonts-})"
          gh release create "$VERSIONED" dist/* \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "Immutable font build revision **${{ steps.tags.outputs.revision }}** for manifest v${{ steps.versions.outputs.metadata }}, binary format v${{ steps.versions.outputs.binary }}." \
            --latest=false \
            --prerelease

      - name: Update rolling fonts tag for device downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="${{ steps.tags.outputs.base }}"
          gh release delete "$BASE" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$BASE" dist/* \
            --repo "${{ github.repository }}" \
            --title "SD Card Fonts (${BASE#fonts-})" \
            --notes "Current font build for manifest v${{ steps.versions.outputs.metadata }}, binary format v${{ steps.versions.outputs.binary }}. Devices download \`fonts.json\` from this release tag.

          Immutable copy: [\`${{ steps.tags.outputs.versioned }}\`](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tags.outputs.versioned }})." \
            --latest=false \
            --prerelease
