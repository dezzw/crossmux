name: Build & Publish SD Card Fonts

# Run manually when font sources or the conversion pipeline change.
# Publishes .cpfont files, fonts.json, and license assets to GitHub Releases on this repo.
on:
  workflow_dispatch:

concurrency:
  group: fonts-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-fonts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install font tools
        run: pip install freetype-py fonttools pyyaml

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev

      - name: Read version constants
        id: versions
        run: |
          cd lib/EpdFont/scripts
          echo "binary=$(python3 -c 'from cpfont_version import CPFONT_VERSION; print(CPFONT_VERSION)')" >> "$GITHUB_OUTPUT"
          echo "metadata=$(python3 -c 'from cpfont_version import FONTS_MANIFEST_VERSION; print(FONTS_MANIFEST_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned core font sources
        run: python3 scripts/fetch_core_font_sources.py

      - name: Build SD card fonts
        run: python3 lib/EpdFont/scripts/build-sd-fonts.py --clean --verbose -j 1

      - name: Verify glyph coverage and file size limits
        run: python3 scripts/verify_core_font_build.py

      - name: Flatten output for release assets
        run: |
          mkdir -p dist
          find lib/EpdFont/scripts/output -name '*.cpfont' -exec cp {} dist/ \;

      - name: Compute release tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="fonts-m${{ steps.versions.outputs.metadata }}-b${{ steps.versions.outputs.binary }}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          LAST=$(gh release list --repo "${{ github.repository }}" \
            --json tagName --jq \
            '[.[] | select(.tagName | startswith("'"${BASE}-r"'")) | .tagName | split("-r")[1] | tonumber] | max // 0')
          NEXT=$((LAST + 1))
          echo "revision=$NEXT" >> "$GITHUB_OUTPUT"
          echo "versioned=${BASE}-r${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Prepare license assets
        run: python3 scripts/prepare_font_release_assets.py --output dist

      - name: Generate immutable manifest
        run: |
          python3 scripts/generate-font-manifest.py \
            --input dist \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.tags.outputs.versioned }}/" \
            --output dist/fonts.immutable.json \
            --descriptions-from lib/EpdFont/scripts/sd-fonts.yaml

      - name: Publish immutable font revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONED="${{ steps.tags.outputs.versioned }}"
          TITLE="SD Card Fonts (${VERSIONED#fonts-})"
          mapfile -t assets < <(find dist -maxdepth 1 -type f ! -name 'fonts.immutable.json' -print)
          gh release create "$VERSIONED" "${assets[@]}" dist/fonts.immutable.json \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "Immutable font build revision **${{ steps.tags.outputs.revision }}** for manifest v${{ steps.versions.outputs.metadata }}, binary format v${{ steps.versions.outputs.binary }}." \
            --latest=false \
            --prerelease

      - name: Update rolling fonts tag for device downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="${{ steps.tags.outputs.base }}"
          cp dist/fonts.immutable.json dist/fonts.json
          mapfile -t cpfonts < <(find dist -maxdepth 1 -name '*.cpfont' -print | sort)
          mapfile -t licenses < <(find dist -maxdepth 1 \( -name '*-OFL.txt' -o -name '*-NOTICE.txt' \) -print | sort)
          if gh release view "$BASE" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$BASE" --repo "${{ github.repository }}" \
              --title "SD Card Fonts (${BASE#fonts-})" \
              --notes "Current font build for manifest v${{ steps.versions.outputs.metadata }}, binary format v${{ steps.versions.outputs.binary }}. Immutable copy: \`${{ steps.tags.outputs.versioned }}\`."
            gh release upload "$BASE" "${cpfonts[@]}" "${licenses[@]}" --repo "${{ github.repository }}" --clobber
            gh release upload "$BASE" dist/fonts.json --repo "${{ github.repository }}" --clobber
          else
            gh release create "$BASE" "${cpfonts[@]}" "${licenses[@]}" dist/fonts.json \
              --repo "${{ github.repository }}" \
              --title "SD Card Fonts (${BASE#fonts-})" \
              --notes "Current font build for manifest v${{ steps.versions.outputs.metadata }}, binary format v${{ steps.versions.outputs.binary }}. Immutable copy: \`${{ steps.tags.outputs.versioned }}\`." \
              --latest=false \
              --prerelease
          fi
