name: "PR Formatting"

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  title-check:
    name: Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      # Bracket form: "[feat] Summary" (preferred). Colon form uses the step below.
      - name: Check PR Title (bracket form)
        if: ${{ startsWith(github.event.pull_request.title, '[') }}
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            patch
            perf
            refactor
            revert
            style
            test
          headerPattern: '^\[(\w+)\] (.*)$'
          headerPatternCorrespondence: type, subject

      - name: Check PR Title (Conventional Commits)
        if: ${{ !startsWith(github.event.pull_request.title, '[') }}
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            patch
            perf
            refactor
            revert
            style
            test
