name: Feature Request
description: Propose a new feature, enhancement, or change to CrossMux
title: "Short, descriptive title of the request"
labels: ["enhancement", "needs-scope-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose a change to CrossMux!

        See [SCOPE.md](../../SCOPE.md) for what belongs in this project. Proposals outside scope may be closed without implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What user-facing problem or reading-experience gap does this address? Be concrete.
      placeholder: e.g., "When reading in landscape, paragraph breaks are inconsistent because..."
    validations:
      required: true

  - type: textarea
    id: stock-gap
    attributes:
      label: Why the current firmware does not already solve this
      description: Explain which existing behavior or settings you checked and why they fall short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: A short description of what you would build or change. Focus on user impact; implementation details can come later.
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Memory / flash / complexity cost
      description: |
        CrossMux runs on ESP32 hardware with tight RAM and flash budgets. Roughly how much DRAM, flash, or code complexity does this add?
        "Don't know" is a valid answer, but please attempt an estimate.
      placeholder: e.g., "Adds ~2KB flash for the new font tables, no DRAM impact at runtime."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else relevant (links, screenshots, related issues).
    validations:
      required: false
